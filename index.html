<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KolicHub | Sayı Düellosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0e14',
                        cardbg: '#131823',
                        accent: '#8b5cf6',
                        accenthover: '#7c3aed'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 overflow-hidden relative">

    <!-- BİLDİRİM BALONU (/pay için) -->
    <div id="notification" class="fixed top-6 right-6 bg-purple-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold translate-y-[-150%] transition-transform duration-300 z-50 flex items-center gap-3 border border-purple-400/40">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="notification-text">Ödül Gönderildi!</span>
    </div>

    <!-- ÜST KISIM: KolicHub Başlık ve /pay Komut Paneli -->
    <header class="w-full flex flex-col items-center gap-4 py-2">
        <div class="inline-flex items-center gap-2 px-6 py-2 rounded-2xl bg-cardbg border border-slate-800/80 shadow-xl">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 via-indigo-300 to-purple-600 bg-clip-text text-transparent">
                KOLICHUB GAMBLE
            </h1>
        </div>

        <!-- /pay [İsim] Paneli (Yukarıda, Ortada) -->
        <div class="flex items-center gap-2 bg-cardbg border border-slate-800 p-2 rounded-2xl shadow-lg">
            <input type="text" id="pay-input" placeholder="/pay isim" class="bg-[#0b0e14] border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 w-56">
            <button onclick="executePay()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition-all cursor-pointer">
                Ödül Gönder
            </button>
        </div>
    </header>

    <!-- ORTA KISIM: Sayı Düellosu Alanı -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-4xl mx-auto w-full gap-8 my-auto">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-3xl mx-auto">
            
            <!-- BİZ TARAFI -->
            <div id="biz-card" class="bg-cardbg border-2 border-slate-800 rounded-3xl p-8 flex flex-col items-center shadow-2xl relative transition-all duration-300">
                <div class="absolute -top-4 bg-purple-600 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-white shadow-lg">
                    Biz
                </div>
                <div class="mb-4 w-full text-center">
                    <input type="text" value="Biz" class="text-xl font-bold bg-transparent text-center border-b border-transparent hover:border-slate-600 focus:border-purple-500 focus:outline-none w-full py-1 text-purple-300">
                </div>
                <div class="h-32 w-32 bg-[#090b10] border border-slate-800 rounded-2xl flex items-center justify-center shadow-inner my-2 overflow-hidden relative">
                    <span id="biz-number" class="text-7xl font-black text-white drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]">?</span>
                </div>
                <span class="text-xs text-slate-500 mt-2 font-medium">1 - 9 Arası Sayı</span>
            </div>

            <!-- İZLEYİCİ TARAFI -->
            <div id="izleyici-card" class="bg-cardbg border-2 border-slate-800 rounded-3xl p-8 flex flex-col items-center shadow-2xl relative transition-all duration-300">
                <div class="absolute -top-4 bg-indigo-600 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-white shadow-lg">
                    İzleyici
                </div>
                <div class="mb-4 w-full text-center">
                    <input type="text" value="İzleyici" class="text-xl font-bold bg-transparent text-center border-b border-transparent hover:border-slate-600 focus:border-indigo-500 focus:outline-none w-full py-1 text-indigo-300">
                </div>
                <div class="h-32 w-32 bg-[#090b10] border border-slate-800 rounded-2xl flex items-center justify-center shadow-inner my-2 overflow-hidden relative">
                    <span id="izleyici-number" class="text-7xl font-black text-white drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">?</span>
                </div>
                <span class="text-xs text-slate-500 mt-2 font-medium">1 - 9 Arası Sayı</span>
            </div>

        </div>

        <!-- DURUM MESAJI VE TETİKLEYİCİ -->
        <div class="flex flex-col items-center gap-4 w-full">
            <div id="result-text" class="text-2xl font-extrabold tracking-wide text-slate-400 h-8 flex items-center justify-center">
                Düello Bekleniyor...
            </div>
            <button onclick="startDuel()" id="roll-btn" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold text-lg px-12 py-4 rounded-2xl shadow-lg shadow-purple-500/20 active:scale-95 transition-all cursor-pointer border border-purple-400/35">
                SAYI ÇEK (SPACE)
            </button>
        </div>

    </main>

    <!-- ALT KISIM: Sadece Tie Sayacı -->
    <footer class="w-full max-w-3xl mx-auto flex items-center justify-center pt-4 border-t border-slate-800/60 text-sm">
        <div class="flex items-center gap-3 bg-cardbg px-6 py-3 rounded-xl border border-slate-800 shadow-lg">
            <span class="text-slate-400 font-semibold">Berabere (Tie):</span>
            <span id="tie-count" class="text-amber-400 font-extrabold text-lg">0</span>
        </div>
    </footer>

    <script>
        let isRolling = false;
        let tieScore = 0;

        function getRandomNumber() {
            return Math.floor(Math.random() * 9) + 1;
        }

        function startDuel() {
            if (isRolling) return;
            isRolling = true;

            const bizSpan = document.getElementById('biz-number');
            const izleyiciSpan = document.getElementById('izleyici-number');
            const resultText = document.getElementById('result-text');
            const bizCard = document.getElementById('biz-card');
            const izleyiciCard = document.getElementById('izleyici-card');
            const rollBtn = document.getElementById('roll-btn');

            bizCard.className = "bg-cardbg border-2 border-slate-800 rounded-3xl p-8 flex flex-col items-center shadow-2xl relative transition-all duration-300";
            izleyiciCard.className = "bg-cardbg border-2 border-slate-800 rounded-3xl p-8 flex flex-col items-center shadow-2xl relative transition-all duration-300";
            resultText.innerText = "Sayılar Çekiliyor...";
            resultText.className = "text-2xl font-extrabold tracking-wide text-purple-400 animate-pulse h-8 flex items-center justify-center";
            rollBtn.disabled = true;
            rollBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let counter = 0;
            const interval = setInterval(() => {
                bizSpan.innerText = getRandomNumber();
                izleyiciSpan.innerText = getRandomNumber();
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    
                    const finalBiz = getRandomNumber();
                    const finalIzleyici = getRandomNumber();

                    bizSpan.innerText = finalBiz;
                    izleyiciSpan.innerText = finalIzleyici;

                    if (finalBiz > finalIzleyici) {
                        resultText.innerText = "BİZ KAZANDIK!";
                        resultText.className = "text-2xl font-extrabold tracking-wide text-emerald-400 h-8 flex items-center justify-center";
                        bizCard.classList.add('border-emerald-500', 'shadow-[0_0_30px_rgba(16,185,129,0.2)]');
                    } else if (finalIzleyici > finalBiz) {
                        resultText.innerText = "İZLEYİCİ KAZANDI!";
                        resultText.className = "text-2xl font-extrabold tracking-wide text-indigo-400 h-8 flex items-center justify-center";
                        izleyiciCard.classList.add('border-indigo-500', 'shadow-[0_0_30px_rgba(99,102,241,0.2)]');
                    } else {
                        tieScore++;
                        document.getElementById('tie-count').innerText = tieScore;
                        resultText.innerText = "BERABERE (TIE)!";
                        resultText.className = "text-2xl font-extrabold tracking-wide text-amber-400 h-8 flex items-center justify-center";
                        bizCard.classList.add('border-amber-500');
                        izleyiciCard.classList.add('border-amber-500');
                    }

                    isRolling = false;
                    rollBtn.disabled = false;
                    rollBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 80);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startDuel();
            }
        });

        function executePay() {
            const input = document.getElementById('pay-input');
            let val = input.value.trim();
            if (!val) return;

            if (val.startsWith('/pay')) {
                val = val.replace('/pay', '').trim();
            }

            if (!val) return;

            showNotification(`Ödül Gönderildi: ${val}`);
            input.value = '';
        }

        document.getElementById('pay-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executePay();
            }
        });

        function showNotification(text) {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notification-text');
            notifText.innerText = text;
            notif.style.transform = 'translateY(0)';
            setTimeout(() => {
                notif.style.transform = 'translateY(-150%)';
            }, 3000);
        }
    </script>
</body>
</html>
