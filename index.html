<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KolicHub | Sayı Düellosu & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0e14',
                        cardbg: '#131823',
                        accent: '#8b5cf6',
                        accenthover: '#7c3aed'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            user-select: none;
        }
        /* Chat kaydırma çubuğu özelleştirme */
        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 overflow-hidden relative">

    <!-- BİLDİRİM BALONU (/pay için) -->
    <div id="notification" class="fixed top-6 right-6 bg-purple-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold translate-y-[-150%] transition-transform duration-300 z-50 flex items-center gap-3 border border-purple-400/40">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="notification-text">Ödül Gönderildi!</span>
    </div>

    <!-- ÜST KISIM: KolicHub Başlık -->
    <header class="w-full text-center py-2 flex justify-center">
        <div class="inline-flex items-center gap-2 px-6 py-2 rounded-2xl bg-cardbg border border-slate-800/80 shadow-xl">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 via-indigo-300 to-purple-600 bg-clip-text text-transparent">
                KOLICHUB GAMBLE
            </h1>
        </div>
    </header>

    <!-- ORTA KISIM: Düello ve Chat Yan Yana -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center max-w-6xl mx-auto w-full gap-6 my-auto">
        
        <!-- SOL/ORTA: Sayı Düellosu Alanı -->
        <div class="flex-1 flex flex-col items-center justify-center w-full gap-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mx-auto">
                
                <!-- BİZ TARAFI -->
                <div id="biz-card" class="bg-cardbg border-2 border-slate-800 rounded-3xl p-6 flex flex-col items-center shadow-2xl relative transition-all duration-300">
                    <div class="absolute -top-4 bg-purple-600 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-white shadow-lg">
                        Biz
                    </div>
                    <div class="mb-3 w-full text-center">
                        <input type="text" value="Biz" class="text-lg font-bold bg-transparent text-center border-b border-transparent hover:border-slate-600 focus:border-purple-500 focus:outline-none w-full py-1 text-purple-300">
                    </div>
                    <div class="h-28 w-28 bg-[#090b10] border border-slate-800 rounded-2xl flex items-center justify-center shadow-inner my-2 overflow-hidden relative">
                        <span id="biz-number" class="text-6xl font-black text-white drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]">?</span>
                    </div>
                    <span class="text-xs text-slate-500 mt-2 font-medium">1 - 9 Arası Sayı</span>
                </div>

                <!-- İZLEYİCİ TARAFI -->
                <div id="izleyici-card" class="bg-cardbg border-2 border-slate-800 rounded-3xl p-6 flex flex-col items-center shadow-2xl relative transition-all duration-300">
                    <div class="absolute -top-4 bg-indigo-600 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-white shadow-lg">
                        İzleyici
                    </div>
                    <div class="mb-3 w-full text-center">
                        <input type="text" value="İzleyici" class="text-lg font-bold bg-transparent text-center border-b border-transparent hover:border-slate-600 focus:border-indigo-500 focus:outline-none w-full py-1 text-indigo-300">
                    </div>
                    <div class="h-28 w-28 bg-[#090b10] border border-slate-800 rounded-2xl flex items-center justify-center shadow-inner my-2 overflow-hidden relative">
                        <span id="izleyici-number" class="text-6xl font-black text-white drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">?</span>
                    </div>
                    <span class="text-xs text-slate-500 mt-2 font-medium">1 - 9 Arası Sayı</span>
                </div>

            </div>

            <!-- DURUM MESAJI VE TETİKLEYİCİ -->
            <div class="flex flex-col items-center gap-3 w-full">
                <div id="result-text" class="text-xl font-extrabold tracking-wide text-slate-400 h-8 flex items-center justify-center">
                    Düello Bekleniyor...
                </div>
                <button onclick="startDuel()" id="roll-btn" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold text-base px-10 py-3.5 rounded-2xl shadow-lg shadow-purple-500/20 active:scale-95 transition-all cursor-pointer border border-purple-400/35">
                    SAYI ÇEK (SPACE)
                </button>
            </div>
        </div>

        <!-- SAĞ: KolicHub Live Chat Kutusu -->
        <div class="w-full lg:w-80 h-80 lg:h-[380px] bg-cardbg border border-slate-800 rounded-3xl p-4 flex flex-col shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                <span class="font-bold text-sm text-purple-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-purple-500 animate-ping"></span>
                    KolicHub Chat
                </span>
                <span class="text-xs text-slate-500">Canlı</span>
            </div>
            
            <!-- Mesajların Akan Alanı -->
            <div id="chat-messages" class="flex-1 overflow-y-auto flex flex-col gap-2.5 pr-1 text-xs">
                <div class="bg-[#0b0e14] p-2.5 rounded-xl border border-slate-800/80">
                    <span class="font-bold text-purple-400">Sistem:</span> <span class="text-slate-300">KolicHub Chat aktif!</span>
                </div>
                <div class="bg-[#0b0e14] p-2.5 rounded-xl border border-slate-800/80">
                    <span class="font-bold text-indigo-400">yosun:</span> <span class="text-slate-300">Selam herkese!</span>
                </div>
            </div>

            <!-- Test Amaçlı Chat'e Mesaj Yazma Kutusu -->
            <div class="mt-3 pt-2 border-t border-slate-800 flex gap-2">
                <input type="text" id="chat-input" placeholder="Chat'e mesaj yaz..." class="flex-1 bg-[#0b0e14] border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500">
                <button onclick="sendChatMessage()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition-all cursor-pointer">
                    Gönder
                </button>
            </div>
        </div>

    </main>

    <!-- ALT KISIM: Tie Sayacı ve /pay İsim Komutu -->
    <footer class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-800/60 text-sm">
        
        <!-- Tie Sayacı -->
        <div class="flex items-center gap-3 bg-cardbg px-5 py-2.5 rounded-xl border border-slate-800 shadow-lg">
            <span class="text-slate-400 font-semibold">Berabere (Tie):</span>
            <span id="tie-count" class="text-amber-400 font-extrabold text-lg">0</span>
        </div>

        <!-- /pay İsim Komut Paneli -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <div class="relative flex-1 sm:w-72">
                <input type="text" id="pay-input" placeholder="/pay isim" class="w-full bg-cardbg border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 shadow-inner">
            </div>
            <button onclick="executePay()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-5 py-2.5 rounded-xl border border-slate-700 transition-all cursor-pointer">
                Gönder
            </button>
        </div>

    </footer>

    <script>
        let isRolling = false;
        let tieScore = 0;

        function getRandomNumber() {
            return Math.floor(Math.random() * 9) + 1;
        }

        function startDuel() {
            if (isRolling) return;
            isRolling = true;

            const bizSpan = document.getElementById('biz-number');
            const izleyiciSpan = document.getElementById('izleyici-number');
            const resultText = document.getElementById('result-text');
            const bizCard = document.getElementById('biz-card');
            const izleyiciCard = document.getElementById('izleyici-card');
            const rollBtn = document.getElementById('roll-btn');

            bizCard.className = "bg-cardbg border-2 border-slate-800 rounded-3xl p-6 flex flex-col items-center shadow-2xl relative transition-all duration-300";
            izleyiciCard.className = "bg-cardbg border-2 border-slate-800 rounded-3xl p-6 flex flex-col items-center shadow-2xl relative transition-all duration-300";
            resultText.innerText = "Sayılar Çekiliyor...";
            resultText.className = "text-xl font-extrabold tracking-wide text-purple-400 animate-pulse h-8 flex items-center justify-center";
            rollBtn.disabled = true;
            rollBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let counter = 0;
            const interval = setInterval(() => {
                bizSpan.innerText = getRandomNumber();
                izleyiciSpan.innerText = getRandomNumber();
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    
                    const finalBiz = getRandomNumber();
                    const finalIzleyici = getRandomNumber();

                    bizSpan.innerText = finalBiz;
                    izleyiciSpan.innerText = finalIzleyici;

                    if (finalBiz > finalIzleyici) {
                        resultText.innerText = "BİZ KAZANDIK!";
                        resultText.className = "text-xl font-extrabold tracking-wide text-emerald-400 h-8 flex items-center justify-center";
                        bizCard.classList.add('border-emerald-500', 'shadow-[0_0_30px_rgba(16,185,129,0.2)]');
                    } else if (finalIzleyici > finalBiz) {
                        resultText.innerText = "İZLEYİCİ KAZANDI!";
                        resultText.className = "text-xl font-extrabold tracking-wide text-indigo-400 h-8 flex items-center justify-center";
                        izleyiciCard.classList.add('border-indigo-500', 'shadow-[0_0_30px_rgba(99,102,241,0.2)]');
                    } else {
                        tieScore++;
                        document.getElementById('tie-count').innerText = tieScore;
                        resultText.innerText = "BERABERE (TIE)!";
                        resultText.className = "text-xl font-extrabold tracking-wide text-amber-400 h-8 flex items-center justify-center";
                        bizCard.classList.add('border-amber-500');
                        izleyiciCard.classList.add('border-amber-500');
                    }

                    isRolling = false;
                    rollBtn.disabled = false;
                    rollBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 80);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startDuel();
            }
        });

        // Chat mesajı ekleme fonksiyonu
        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val) return;

            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = "bg-[#0b0e14] p-2.5 rounded-xl border border-slate-800/80";
            msgDiv.innerHTML = `<span class="font-bold text-indigo-300">İzleyici:</span> <span class="text-slate-300">${val}</span>`;
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            input.value = '';
        }

        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        function executePay() {
            const input = document.getElementById('pay-input');
            let val = input.value.trim();
            if (!val) return;

            if (val.startsWith('/pay')) {
                val = val.replace('/pay', '').trim();
            }

            if (!val) return;

            showNotification(`Ödül Gönderildi: ${val}`);
            input.value = '';
        }

        document.getElementById('pay-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executePay();
            }
        });

        function showNotification(text) {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notification-text');
            notifText.innerText = text;
            notif.style.transform = 'translateY(0)';
            setTimeout(() => {
                notif.style.transform = 'translateY(-150%)';
            }, 3000);
        }
    </script>
</body>
</html>
